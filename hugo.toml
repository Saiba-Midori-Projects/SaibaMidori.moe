baseURL = 'https://saibamidori.moe/'
defaultContentLanguage = 'zh-CN'
defaultContentLanguageInSubdir = false
theme = 'midori'

[languages]
  [languages.zh-CN]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    title = 'Project for Saiba Midori'
    weight = 1

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    title = 'Project for Saiba Midori'
    weight = 2

disableKinds = ["taxonomy", "term"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 设置为 true 以允许在 Markdown 文件中直接写 HTML 标签
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
